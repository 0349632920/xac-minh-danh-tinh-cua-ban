<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đố Vui Lớp 6A8</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 50%, #ff6a00 100%);
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 35px 30px;
      width: 100%; max-width: 520px;
      animation: pop 0.5s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .header { text-align: center; margin-bottom: 25px; }
    .header .emoji { font-size: 48px; display: block; margin-bottom: 8px; }
    .header h1 { color: #e65100; font-size: 24px; margin-bottom: 6px; }
    .header p  { color: #888; font-size: 14px; }

    .progress-bar {
      height: 10px; background: #f0f0f0;
      border-radius: 10px; overflow: hidden; margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #f7971e, #ff6a00);
      border-radius: 10px; transition: width 0.4s ease;
    }
    .progress-text {
      text-align: right; font-size: 12px; color: #999; margin-bottom: 20px;
    }

    .question {
      font-size: 18px; font-weight: 700; color: #333;
      margin-bottom: 22px; line-height: 1.4;
    }

    .options { display: flex; flex-direction: column; gap: 12px; }

    .option {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border: 2px solid #e0e0e0; border-radius: 14px;
      cursor: pointer; transition: all 0.25s ease;
      font-size: 15px; color: #333; background: #fafafa;
    }
    .option:hover { border-color: #f7971e; background: #fff8f0; transform: translateX(4px); }
    .option .letter {
      width: 28px; height: 28px; border-radius: 50%;
      background: #e0e0e0; color: #666; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; transition: all 0.25s;
    }
    .option.correct { border-color: #4caf50; background: #e8f5e9; }
    .option.correct .letter { background: #4caf50; color: #fff; }
    .option.wrong { border-color: #f44336; background: #ffebee; }
    .option.wrong .letter { background: #f44336; color: #fff; }
    .option.disabled { pointer-events: none; opacity: 0.85; }

    .text-input {
      width: 100%; padding: 14px 18px;
      border: 2px solid #e0e0e0; border-radius: 14px;
      font-size: 15px; outline: none; transition: all 0.25s;
    }
    .text-input:focus { border-color: #f7971e; box-shadow: 0 0 0 4px rgba(247,151,30,0.15); }

    .feedback {
      margin-top: 20px; padding: 14px 18px; border-radius: 12px;
      font-size: 14px; display: none; animation: pop 0.3s ease;
    }
    .feedback.correct { display: block; background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
    .feedback.wrong   { display: block; background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }

    .btn {
      width: 100%; padding: 15px; margin-top: 20px;
      background: linear-gradient(135deg, #f7971e, #ff6a00);
      color: #fff; font-size: 16px; font-weight: bold;
      border: none; border-radius: 14px; cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,106,0,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .result-screen { text-align: center; display: none; }
    .result-screen .big-emoji { font-size: 80px; margin-bottom: 15px; }
    .result-screen h2 { color: #e65100; font-size: 26px; margin-bottom: 10px; }
    .result-screen .score {
      font-size: 42px; font-weight: 800; color: #f7971e; margin: 20px 0;
    }
    .result-screen .msg { color: #666; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }

    @media (max-width: 480px) {
      .container { padding: 25px 20px; }
      .question { font-size: 16px; }
      .option { font-size: 14px; padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="startScreen">
      <div class="header">
        <span class="emoji">🎯</span>
        <h1 id="startTitle">Đố Vui Lớp 6A8</h1>
        <p id="startDesc">Bạn hiểu lớp mình đến đâu? Cùng chơi nào!</p>
      </div>
      <button class="btn" onclick="startQuiz()">🚀 Bắt Đầu Chơi</button>
    </div>

    <div id="quizScreen" style="display:none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Câu 1 / 5</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">
        Câu Tiếp Theo →
      </button>
    </div>

    <div id="resultScreen" class="result-screen">
      <div class="big-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">Hoàn Thành!</h2>
      <div class="score" id="scoreText">0 / 0</div>
      <p class="msg" id="resultMsg"></p>
      <button class="btn" onclick="restartQuiz()">🔄 Chơi Lại</button>
    </div>
  </div>

  <script>
    let questions = [];
    let current = 0;
    let score = 0;
    let answered = false;

    async function loadQuiz() {
      try {
        const res = await fetch('/api/questions');
        if (!res.ok) throw new Error('API lỗi');
        const data = await res.json();
        questions = data.cauHoi;

        if (data.tieuDe) document.getElementById('startTitle').textContent = data.tieuDe;
        if (data.moTa)   document.getElementById('startDesc').textContent = data.moTa;
      } catch (err) {
        alert('Không tải được câu hỏi từ server!');
        console.error(err);
      }
    }
    window.addEventListener('DOMContentLoaded', loadQuiz);

    function startQuiz() {
      if (questions.length === 0) { alert('Đang tải câu hỏi...'); return; }
      current = 0; score = 0;
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('quizScreen').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = questions[current];

      document.getElementById('progressFill').style.width =
        ((current) / questions.length * 100) + '%';
      document.getElementById('progressText').textContent =
        `Câu ${current + 1} / ${questions.length}`;

      document.getElementById('questionText').textContent = q.cauHoi;

      const box = document.getElementById('optionsBox');
      box.innerHTML = '';
      const fb = document.getElementById('feedback');
      fb.className = 'feedback';
      fb.innerHTML = '';
      document.getElementById('nextBtn').style.display = 'none';

      if (q.loai === 'tuLuan') {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-input';
        input.id = 'tuluanInput';
        input.placeholder = 'Nhập câu trả lời của bạn...';
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') submitAnswer({ tuluan: input.value });
        });
        box.appendChild(input);

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = '✅ Trả Lời';
        btn.onclick = () => submitAnswer({ tuluan: input.value });
        box.appendChild(btn);

        setTimeout(() => input.focus(), 100);
      } else {
        q.dapAn.forEach((opt, i) => {
          const div = document.createElement('div');
          div.className = 'option';
          div.innerHTML = `<span class="letter">${String.fromCharCode(65 + i)}</span><span>${opt}</span>`;
          div.onclick = () => submitAnswer({ choice: i, el: div });
          box.appendChild(div);
        });
      }
    }

    async function submitAnswer(payload) {
      if (answered) return;
      const q = questions[current];

      if (payload.choice !== undefined) {
        answered = true;
        const allOpts = document.querySelectorAll('.option');
        allOpts.forEach(o => o.classList.add('disabled'));
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: q.id, answer: payload.choice })
        });
        const data = await res.json();
        if (data.correct) {
          payload.el.classList.add('correct');
          score++;
          showFeedback(true, data.giaiThich);
        } else {
          payload.el.classList.add('wrong');
          allOpts[data.dapAnDung].classList.add('correct');
          showFeedback(false, data.giaiThich);
        }
        showNext();
      } else {
        const val = (payload.tuluan || '').trim();
        if (!val) { alert('Hãy nhập câu trả lời!'); return; }
        answered = true;
        document.getElementById('tuluanInput').disabled = true;

        const res = await fetch('/api/check', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ id: q.id, answer: val })
        });
        const data = await res.json();
        if (data.correct) { score++; showFeedback(true, data.giaiThich); }
        else              { showFeedback(false, data.giaiThich); }

        const tuluanBtn = document.querySelector('#optionsBox .btn');
        if (tuluanBtn) tuluanBtn.style.display = 'none';
        showNext();
      }
    }

    function showFeedback(correct, explain) {
      const fb = document.getElementById('feedback');
      fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
      fb.innerHTML = correct
        ? `✅ <b>Chính xác!</b>${explain ? '<br>' + explain : ''}`
        : `❌ <b>Sai rồi!</b>${explain ? '<br>' + explain : ''}`;
    }

    function showNext() {
      const btn = document.getElementById('nextBtn');
      btn.style.display = 'block';
      btn.textContent = (current === questions.length - 1)
        ? '🏁 Xem Kết Quả' : 'Câu Tiếp Theo →';
    }

    function nextQuestion() {
      if (current < questions.length - 1) { current++; renderQuestion(); }
      else showResult();
    }

    function showResult() {
      document.getElementById('quizScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';

      const total = questions.length;
      const percent = Math.round(score / total * 100);
      document.getElementById('scoreText').textContent = `${score} / ${total}`;

      let emoji, title, msg;
      if (percent === 100)      { emoji = '🏆'; title = 'Xuất Sắc!';     msg = 'Bạn đúng tất cả! Quá đỉnh!'; }
      else if (percent >= 80)   { emoji = '🌟'; title = 'Rất Giỏi!';     msg = 'Bạn hiểu lớp mình rất rõ đấy!'; }
      else if (percent >= 50)   { emoji = '👍'; title = 'Khá Lắm!';      msg = 'Cũng ổn rồi, cố gắng thêm nhé!'; }
      else                      { emoji = '😅'; title = 'Cần Cố Gắng!';  msg = 'Thử lại xem sao nhé!'; }

      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultMsg').textContent = msg;
    }

    function restartQuiz() {
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('startScreen').style.display = 'block';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xác Minh Danh Tính - Lớp 6A8</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6dd5ed 100%);
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%; max-width: 450px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo { text-align: center; margin-bottom: 25px; }
    .logo .badge {
      display: inline-block;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white; font-size: 28px; font-weight: bold;
      padding: 15px 30px; border-radius: 50px;
      letter-spacing: 2px;
      box-shadow: 0 8px 20px rgba(30, 60, 114, 0.4);
    }

    h1 { text-align: center; color: #1e3c72; font-size: 22px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }

    .form-group { margin-bottom: 20px; }
    label { display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    input {
      width: 100%; padding: 14px 18px;
      border: 2px solid #e0e0e0; border-radius: 12px;
      font-size: 15px; transition: all 0.3s ease; outline: none;
    }
    input:focus { border-color: #2a5298; box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.15); }

    .btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      transition: all 0.3s ease; margin-top: 10px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(30, 60, 114, 0.4); }
    .btn:active { transform: translateY(0); }

    .result {
      margin-top: 25px; padding: 20px; border-radius: 12px;
      text-align: center; font-weight: 600; display: none;
      animation: fadeIn 0.4s ease;
    }
    .result.success { display: block; background: #e8f5e9; color: #2e7d32; border: 2px solid #4caf50; }
    .result.error   { display: block; background: #ffebee; color: #c62828; border: 2px solid #f44336; }
    .result .icon { font-size: 40px; display: block; margin-bottom: 10px; }

    .info-card {
      margin-top: 20px; background: #f5f7fa; border-radius: 12px;
      padding: 18px; display: none; border-left: 4px solid #2a5298;
    }
    .info-card.show { display: block; animation: fadeIn 0.4s ease; }
    .info-card h3 { color: #1e3c72; margin-bottom: 12px; font-size: 16px; }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px dashed #ddd; font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label-info { color: #666; font-weight: 500; }
    .info-row .value-info { color: #1e3c72; font-weight: 700; }

    .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="badge">6A8</span>
    </div>
    <h1>Xác Minh Danh Tính</h1>
    <p class="subtitle">Hệ thống xác minh học sinh lớp 6A8</p>

    <div class="form-group">
      <label for="studentId">Mã học sinh</label>
      <input type="text" id="studentId" placeholder="Nhập mã học sinh (VD: 6A8-001)" />
    </div>

    <div class="form-group">
      <label for="fullName">Họ và tên</label>
      <input type="text" id="fullName" placeholder="Nhập họ và tên đầy đủ" />
    </div>

    <button class="btn" onclick="verify()">🔍 Xác Minh</button>

    <div class="result" id="result"></div>

    <div class="info-card" id="infoCard">
      <h3>📋 Thông tin học sinh</h3>
      <div class="info-row">
        <span class="label-info">Họ tên:</span>
        <span class="value-info" id="infoName">—</span>
      </div>
      <div class="info-row">
        <span class="label-info">Lớp:</span>
        <span class="value-info" id="infoLop">6A8</span>
      </div>
      <div class="info-row">
        <span class="label-info">Trạng thái:</span>
        <span class="value-info" style="color:#2e7d32;">✓ Đã xác minh</span>
      </div>
    </div>

    <div class="footer">© 2026 Hệ thống xác minh lớp 6A8</div>
  </div>

  <script>
    let students = {};
    let dataLoaded = false;
    let thongTinLop = { lop: "6A8", namHoc: "" };

    async function loadStudents() {
      try {
        const res = await fetch('students.json');
        if (!res.ok) throw new Error('Không tải được students.json');
        const data = await res.json();

        students = {};
        data.hocSinh.forEach(hs => {
          students[hs.maHS.toUpperCase()] = hs.hoTen;
        });

        thongTinLop = { lop: data.lop || "6A8", namHoc: data.namHoc || "" };

        // Cập nhật tiêu đề
        document.querySelector('.badge').textContent = thongTinLop.lop;
        document.querySelector('.subtitle').textContent =
          `Hệ thống xác minh học sinh lớp ${thongTinLop.lop}` +
          (thongTinLop.namHoc ? ` - Năm học ${thongTinLop.namHoc}` : '');
        document.getElementById('infoLop').textContent = thongTinLop.lop;
        document.querySelector('.footer').textContent =
          `© 2026 Hệ thống xác minh lớp ${thongTinLop.lop}`;

        dataLoaded = true;
      } catch (err) {
        console.error(err);
        const result = document.getElementById('result');
        result.className = 'result error';
        result.innerHTML = '<span class="icon">⚠️</span>Không tải được dữ liệu học sinh!';
      }
    }

    window.addEventListener('DOMContentLoaded', loadStudents);

    function verify() {
      if (!dataLoaded) {
        alert('Dữ liệu học sinh chưa tải xong, vui lòng đợi...');
        return;
      }

      const id = document.getElementById('studentId').value.trim().toUpperCase();
      const name = document.getElementById('fullName').value.trim();
      const result = document.getElementById('result');
      const infoCard = document.getElementById('infoCard');

      result.className = 'result';
      result.innerHTML = '';
      infoCard.classList.remove('show');

      if (!id || !name) {
        result.className = 'result error';
        result.innerHTML = '<span class="icon">⚠️</span>Vui lòng nhập đầy đủ mã học sinh và họ tên!';
        return;
      }

      const found = students[id];
      if (!found) {
        result.className = 'result error';
        result.innerHTML = `<span class="icon">❌</span>Mã học sinh không tồn tại trong hệ thống lớp ${thongTinLop.lop}!`;
        return;
      }

      const normalize = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
      if (normalize(found) !== normalize(name)) {
        result.className = 'result error';
        result.innerHTML = '<span class="icon">❌</span>Họ tên không khớp với mã học sinh!';
        return;
      }

      result.className = 'result success';
      result.innerHTML = `<span class="icon">✅</span>Xác minh thành công! Chào mừng ${found} đến với lớp ${thongTinLop.lop}!`;
      document.getElementById('infoName').textContent = found;
      infoCard.classList.add('show');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') verify();
    });
  </script>
</body>
</html>
